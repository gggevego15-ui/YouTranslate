<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YouTranslate</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{position:relative;overflow:hidden;margin:0;width:340px;min-height:390px;padding:22px;background:radial-gradient(ellipse at 0% 0%,#5143a855,transparent 48%),radial-gradient(ellipse at 100% 100%,#2776ce3b,transparent 45%),#10121b;color:#f8f8ff;font-size:13px;line-height:1.5}
body:before,body:after{content:"";position:absolute;z-index:-1;border-radius:50%;filter:blur(1px);pointer-events:none;animation:float 9s ease-in-out infinite}
body:before{width:170px;height:170px;right:-80px;top:30px;background:radial-gradient(circle at 35% 35%,#b2a0ff66,#7765ff05 70%)}
body:after{width:140px;height:140px;left:-70px;bottom:-45px;background:radial-gradient(circle at 50% 50%,#5ac8fa44,#5ac8fa00 72%);animation-delay:-4s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-12px,13px) scale(1.08)}}
@keyframes appear{from{opacity:0;transform:translateY(9px) scale(.985);filter:blur(5px)}to{opacity:1;transform:none;filter:blur(0)}}
.shell{animation:appear .38s cubic-bezier(.2,.8,.2,1);border:1px solid #ffffff20;border-radius:24px;padding:18px;background:linear-gradient(145deg,#ffffff12,#ffffff04);backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);box-shadow:0 24px 60px #0006,inset 0 1px #ffffff18}
.head{display:flex;align-items:center;gap:12px;margin-bottom:19px}
.logo{position:relative;display:grid;place-items:center;flex:0 0 46px;height:46px;border-radius:16px;background:linear-gradient(135deg,#b69cff,#6b64ff 55%,#48b5ff);box-shadow:0 8px 24px #7665ff55,inset 0 1px #ffffff65;font-size:24px}
.logo:after{content:"";position:absolute;inset:-4px;border:1px solid #a99aff40;border-radius:19px;animation:ring 3s ease-in-out infinite}
@keyframes ring{0%,100%{opacity:.3;transform:scale(.98)}50%{opacity:.9;transform:scale(1.04)}}
.title{font-size:18px;font-weight:780;letter-spacing:-.45px}.sub{margin-top:1px;color:#b7b9cc;font-size:11px}
.pill{display:inline-flex;align-items:center;gap:7px;margin:0 0 14px;padding:5px 9px;border:1px solid #ffffff17;border-radius:999px;background:#ffffff09;color:#d8d8eb;font-size:10px;letter-spacing:.25px}
.dot{width:6px;height:6px;border-radius:50%;background:#6ee7b7;box-shadow:0 0 10px #6ee7b7a0}
.card{padding:14px;border:1px solid #ffffff1e;border-radius:17px;background:linear-gradient(140deg,#ffffff0b,#ffffff04);box-shadow:inset 0 1px #ffffff0c}
label{display:block;color:#d9daea;font-weight:600;margin:0 0 8px}
select{width:100%;padding:11px 12px;border-radius:12px;border:1px solid #ffffff22;background:#202333;color:#fff;outline:none;transition:border-color .2s,box-shadow .2s}
select:focus{border-color:#a99affaa;box-shadow:0 0 0 3px #8b5cf626}
.open{position:relative;overflow:hidden;width:100%;margin-top:13px;padding:12px 14px;border:1px solid #ffffff30;border-radius:13px;background:linear-gradient(110deg,#9a72ff,#6177ff,#5aafff,#9a72ff);background-size:220% 100%;color:white;font-weight:750;cursor:pointer;box-shadow:inset 0 1px #ffffff45,0 8px 25px #6652e633;transition:transform .2s,box-shadow .2s,filter .2s}
.open:hover{transform:translateY(-2px);filter:brightness(1.08);box-shadow:inset 0 1px #ffffff55,0 12px 30px #6652e655}.open:active{transform:scale(.985)}
.tip{color:#aeb1c6;font-size:11px;line-height:1.55;margin:14px 2px 1px}.foot{display:flex;justify-content:space-between;align-items:center;margin-top:17px;color:#8d91a9;font-size:10px}.version{padding:3px 7px;border:1px solid #ffffff14;border-radius:7px;background:#ffffff07}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="shell">
  <header class="head"><div class="logo">文</div><div><div class="title">YouTranslate</div><div class="sub">Голосовой перевод YouTube</div></div></header>
  <div class="pill"><span class="dot"></span> ПЕРЕВОД В РЕАЛЬНОМ ВРЕМЕНИ</div>
  <section class="card"><label for="language">Язык озвучки</label><select id="language"><option value="ru">🇷🇺 Русский</option><option value="en">🇺🇸 English</option><option value="es">🇪🇸 Español</option><option value="de">🇩🇪 Deutsch</option><option value="fr">🇫🇷 Français</option><option value="it">🇮🇹 Italiano</option><option value="pt">🇵🇹 Português</option><option value="pl">🇵🇱 Polski</option><option value="tr">🇹🇷 Türkçe</option><option value="uk">🇺🇦 Українська</option><option value="ja">🇯🇵 日本語</option><option value="ko">🇰🇷 한국어</option><option value="zh-CN">🇨🇳 中文</option><option value="ar">🇸🇦 العربية</option><option value="hi">🇮🇳 हिन्दी</option></select></section>
  <button class="open" id="open">Открыть YouTube <span aria-hidden="true">↗</span></button>
  <p class="tip">Открой видео и нажми плавающую кнопку «Перевод голоса». Сначала расширение попробует взять субтитры YouTube; если их нет — запустит локальное распознавание Whisper.</p>
  <footer class="foot"><span>Аудио обрабатывается в браузере</span><span class="version">BETA · 0.1.13</span></footer>
</main>
<script src="popup.js"></script>
</body>
</html>
