name: Package Firefox extension

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install build dependencies
        run: npm install --no-audit --no-fund
      - name: Validate source files
        run: |
          node -e "const m=require('./manifest.json'); if(m.manifest_version!==3 || !m.content_scripts || !m.background || !m.web_accessible_resources) process.exit(1); console.log('Manifest OK:', m.name, m.version)"
          node --check content.js
          node --check background.js
          node --check popup.js
          node --check asr-engine-src.js
      - name: Bundle local Whisper engine
        run: |
          mkdir -p dist
          npm run build:asr
      - name: Assemble and package extension
        run: |
          cp manifest.json content.js background.js popup.html popup.js dist/
          test -s dist/asr-engine.js
          cd dist
          zip -r ../YouTranslate-Firefox.zip manifest.json content.js background.js popup.html popup.js asr-engine.js
          cd ..
          unzip -t YouTranslate-Firefox.zip
      - name: Upload extension package
        uses: actions/upload-artifact@v4
        with:
          name: YouTranslate-Firefox
          path: YouTranslate-Firefox.zip
          if-no-files-found: error
